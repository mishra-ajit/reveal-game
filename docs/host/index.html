<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal · Host</title>
<!--
  Short link for the host. The PIN is deliberately NOT stored here — this page
  is public, so anyone who guessed the URL would otherwise get host controls.
  Enter it once; the browser remembers it for next time.
-->
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#FAFAFA;color:#263238;
       font:500 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{background:#fff;border-radius:18px;padding:26px 22px;width:min(320px,86vw);
       box-shadow:0 1px 2px rgba(38,50,56,.06),0 6px 20px rgba(38,50,56,.07);text-align:center}
  h1{font-size:19px;margin:0 0 4px}
  p{color:#78909C;font-size:13px;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;font:600 20px/1 inherit;text-align:center;
        letter-spacing:.3em;padding:14px;border:1px solid #ECEFF1;border-radius:12px;background:#FAFAFA}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;cursor:pointer;
         background:#37474F;color:#fff;font:600 15px inherit}
</style>
</head>
<body>
<div class="box">
  <h1>Host console</h1>
  <p>Enter your host PIN</p>
  <input id="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="····" autofocus>
  <button onclick="go()">Open</button>
</div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbx2Z30xc4WAF2U8pXcB-diwbd8WNiDC4eyqI-PkIplTH99t4fsjhbPzX8UiktRE2Cdk8w/exec';
  var el = document.getElementById('pin');
  try { el.value = localStorage.getItem('reveal.pin') || ''; } catch (e) {}
  function go(){
    var p = el.value.trim();
    if (!p) { el.focus(); return; }
    try { localStorage.setItem('reveal.pin', p); } catch (e) {}
    location.href = APP + '?host=' + encodeURIComponent(p);
  }
  el.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  // A PIN we already know is a one-tap trip, not a form to fill in again.
  if (el.value) go();
</script>
</body>
</html>
