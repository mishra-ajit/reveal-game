<style>
  /* Material Design palette — Blue 600 / Pink 600 on Blue Grey neutrals */
  :root{
    --bg:#FAFAFA; --card:#FFFFFF; --ink:#263238; --sub:#78909C; --line:#ECEFF1;
    --blue:#1E88E5; --blue-soft:#E3F2FD; --blue-deep:#1565C0;
    --pink:#D81B60; --pink-soft:#FCE4EC; --pink-deep:#AD1457;
    --ok:#00897B; --slate:#37474F;
    --radius:18px;
    --shadow:0 1px 2px rgba(38,50,56,.06), 0 6px 20px rgba(38,50,56,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{margin:0;padding:0;background:var(--bg)}
  body{margin:0;padding:0}
  body{
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 8px);
  }
  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 28px}
  .wide{max-width:760px}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  h1{font-size:30px}
  h2{font-size:22px}
  p{margin:0}
  .sub{color:var(--sub);font-size:14px}
  .tiny{font-size:12px;color:var(--sub)}
  .center{text-align:center}
  .stack>*+*{margin-top:12px}
  .stack-lg>*+*{margin-top:20px}
  .hidden{display:none !important}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:18px;box-shadow:var(--shadow)}
  .board,.card,.team,.opt,input,.btn{position:relative;z-index:1}
  .card.flat{box-shadow:none}

  /* ---- scoreboard ---- */
  .board{display:flex;gap:10px;margin-bottom:14px}
  .board .side{flex:1;border-radius:14px;padding:10px 14px;display:flex;
               align-items:baseline;justify-content:space-between}
  .board .blue{background:var(--blue-soft);color:var(--blue)}
  .board .pink{background:var(--pink-soft);color:var(--pink)}
  .board .label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .board .num{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

  /* ---- buttons ---- */
  button{font:inherit;cursor:pointer}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;
       font-size:17px;font-weight:600;background:var(--slate);color:#fff;
       transition:transform .08s ease,opacity .15s ease}
  .btn:active{transform:scale(.985)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.blue{background:var(--blue)}
  .btn.pink{background:var(--pink)}
  .btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>.btn{width:auto;flex:1}

  /* ---- team pick ---- */
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .team{border:2px solid var(--line);background:#fff;border-radius:var(--radius);
        padding:22px 12px;text-align:center;font-weight:700;font-size:17px;color:var(--ink);
        transition:border-color .15s ease,background .15s ease,transform .08s ease}
  .team:active{transform:scale(.98)}
  .team .dot{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 10px}
  .team.b .dot{background:var(--blue)} .team.p .dot{background:var(--pink)}
  .team.b.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .team.p.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}

  input[type=text],input[type=number],input[type=tel]{
    width:100%;padding:16px;border:1px solid var(--line);border-radius:14px;
    font:inherit;font-size:17px;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--ink)}
  input[type=number]{font-size:26px;font-weight:700;text-align:center;
                     font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  /* ---- roster ---- */
  .roster{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .roster h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .roster .b h3{color:var(--blue)} .roster .p h3{color:var(--pink)}
  .roster ul{list-style:none;margin:0;padding:0}
  .roster li{padding:5px 0;font-size:15px;display:flex;justify-content:space-between;gap:6px}
  .roster li span{color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
  .roster li.me{font-weight:700}

  /* ---- question ---- */
  .qmeta{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
  .qtext{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-top:6px}
  .qimg{width:100%;border-radius:14px;margin-top:14px;display:block;background:#ECEFF1;
        aspect-ratio:16/10;object-fit:cover}
  .opts{display:grid;gap:10px;margin-top:16px}
  .opt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;
       padding:15px 16px;font-size:16px;font-weight:500;color:var(--ink);width:100%;
       transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.99)}
  .opt.on{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
  .opt.right{border-color:var(--ok);background:#E0F2F1;font-weight:700}
  .opt.wrong{border-color:var(--pink);background:var(--pink-soft)}
  .opts.grid{grid-template-columns:1fr 1fr}
  .opt.img{padding:0;overflow:hidden}
  .opt.img img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ECEFF1}
  .opt.img .cap{display:block;padding:10px 12px;font-size:14px}

  /* ---- reveal ---- */
  .answer{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;
          font-variant-numeric:tabular-nums}
  .answer small{display:block;font-size:13px;font-weight:600;color:var(--sub);
                letter-spacing:.02em;margin-top:6px}
  .guesses{list-style:none;margin:14px 0 0;padding:0}
  .guesses li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);
              font-size:15px}
  .guesses li:first-child{border-top:0}
  .pip{width:8px;height:8px;border-radius:50%;flex:none}
  .pip.blue{background:var(--blue)} .pip.pink{background:var(--pink)}
  .guesses .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .guesses .gv{font-variant-numeric:tabular-nums;color:var(--sub)}
  .guesses .pt{font-weight:700;font-size:13px;color:var(--ok);min-width:30px;text-align:right}
  .guesses li.zero .pt{color:var(--line)}
  .note{margin-top:14px;padding:12px 14px;background:#F5F7F8;border-radius:12px;
        font-size:14px;color:var(--sub);line-height:1.5}

  /* ---- 2045 allocator ---- */
  .alloc{list-style:none;margin:0;padding:0}
  .alloc li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .alloc li:first-child{border-top:0}
  .alloc .nm{flex:1;font-size:15px;font-weight:500}
  .alloc .val{width:42px;text-align:center;font-weight:800;font-size:19px;
              font-variant-numeric:tabular-nums}
  .step{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;
        font-size:19px;font-weight:600;color:var(--ink);line-height:1;flex:none}
  .step:active{background:#ECEFF1}
  .step[disabled]{opacity:.3}
  .budget{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
          margin:14px -18px -18px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
          border-radius:0 0 var(--radius) var(--radius)}
  .budget .n{font-weight:800;font-variant-numeric:tabular-nums}
  .budget .n.over{color:var(--pink)} .budget .n.zero{color:var(--ok)}

  .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;
           font-variant-numeric:tabular-nums}
  .compare .h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
              padding-bottom:6px}
  .compare .h.b{color:var(--blue);text-align:right} .compare .h.p{color:var(--pink)}
  .compare .lbl{font-size:13px;color:var(--sub);text-align:center;white-space:nowrap}
  .bar{height:26px;border-radius:7px;display:flex;align-items:center;font-size:13px;
       font-weight:700;padding:0 7px;color:#fff;min-width:22px}
  .bar.b{background:var(--blue);justify-content:flex-end;margin-left:auto}
  .bar.p{background:var(--pink)}
  .bar.o{background:#ECEFF1;color:var(--sub)}

  .scen{border-radius:14px;padding:18px;background:var(--slate);color:#fff}
  .scen h2{font-size:20px;margin-bottom:8px}
  .scen p{font-size:15px;opacity:.82;line-height:1.5}

  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;
        font-weight:700;letter-spacing:.02em}
  .pill.blue{background:var(--blue-soft);color:var(--blue)}
  .pill.pink{background:var(--pink-soft);color:var(--pink)}
  .pill.grey{background:#ECEFF1;color:var(--sub)}
  .pill.ok{background:#E0F2F1;color:var(--ok)}

  .wait{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);
        border-top-color:var(--sub);animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .opt.img.noimg{min-height:64px;display:flex;align-items:center;justify-content:center}


  /* A quiet dusk scene sits behind every screen. It is one inline SVG, so it
     costs no request and cannot fail to load; the wash over it keeps text at
     full contrast. */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20400%20800%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22sky%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23D9E6FA%22%2F%3E%3Cstop%20offset%3D%220.34%22%20stop-color%3D%22%23E9E4F6%22%2F%3E%20%3Cstop%20offset%3D%220.62%22%20stop-color%3D%22%23F9DEE8%22%2F%3E%3Cstop%20offset%3D%220.85%22%20stop-color%3D%22%23FDE6DC%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FFF1E6%22%2F%3E%20%3C%2FlinearGradient%3E%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%220.5%22%20cy%3D%220.5%22%20r%3D%220.5%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FFFFFF%22%20stop-opacity%3D%220.98%22%2F%3E%20%3Cstop%20offset%3D%220.5%22%20stop-color%3D%22%23FFD9BE%22%20stop-opacity%3D%220.6%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FFD9BE%22%20stop-opacity%3D%220%22%2F%3E%20%3C%2FradialGradient%3E%20%3ClinearGradient%20id%3D%22far%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%239FB8DF%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23BCCDE9%22%2F%3E%20%3C%2FlinearGradient%3E%20%3ClinearGradient%20id%3D%22mid%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237E9BCB%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239FB6DD%22%2F%3E%20%3C%2FlinearGradient%3E%20%3ClinearGradient%20id%3D%22near%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23E79CB6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F0BACE%22%2F%3E%20%3C%2FlinearGradient%3E%20%3ClinearGradient%20id%3D%22water%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F7C9D8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23EBD6E8%22%2F%3E%20%3C%2FlinearGradient%3E%20%3C%2Fdefs%3E%20%3Crect%20width%3D%22400%22%20height%3D%22800%22%20fill%3D%22url(%23sky)%22%2F%3E%20%3Ccircle%20cx%3D%22292%22%20cy%3D%22196%22%20r%3D%22170%22%20fill%3D%22url(%23glow)%22%2F%3E%20%3Ccircle%20cx%3D%22292%22%20cy%3D%22196%22%20r%3D%2246%22%20fill%3D%22%23FFF7EF%22%2F%3E%20%3Cg%20fill%3D%22%23FFFFFF%22%20opacity%3D%220.7%22%3E%20%3Cellipse%20cx%3D%2286%22%20cy%3D%22150%22%20rx%3D%2258%22%20ry%3D%2214%22%2F%3E%3Cellipse%20cx%3D%22128%22%20cy%3D%22140%22%20rx%3D%2236%22%20ry%3D%2211%22%2F%3E%20%3Cellipse%20cx%3D%22318%22%20cy%3D%22298%22%20rx%3D%2266%22%20ry%3D%2213%22%2F%3E%3Cellipse%20cx%3D%22272%22%20cy%3D%22290%22%20rx%3D%2232%22%20ry%3D%2210%22%2F%3E%20%3Cellipse%20cx%3D%2254%22%20cy%3D%22352%22%20rx%3D%2248%22%20ry%3D%2211%22%2F%3E%3Cellipse%20cx%3D%22352%22%20cy%3D%22108%22%20rx%3D%2240%22%20ry%3D%2210%22%2F%3E%20%3C%2Fg%3E%20%3Cg%20fill%3D%22%23FFFFFF%22%20opacity%3D%220.9%22%3E%20%3Ccircle%20cx%3D%2248%22%20cy%3D%2270%22%20r%3D%221.9%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%2246%22%20r%3D%221.5%22%2F%3E%3Ccircle%20cx%3D%22210%22%20cy%3D%2296%22%20r%3D%221.7%22%2F%3E%20%3Ccircle%20cx%3D%22356%22%20cy%3D%2258%22%20r%3D%221.6%22%2F%3E%3Ccircle%20cx%3D%2292%22%20cy%3D%22212%22%20r%3D%221.4%22%2F%3E%3Ccircle%20cx%3D%22374%22%20cy%3D%22230%22%20r%3D%221.7%22%2F%3E%20%3Ccircle%20cx%3D%2224%22%20cy%3D%22132%22%20r%3D%221.3%22%2F%3E%3Ccircle%20cx%3D%22188%22%20cy%3D%22168%22%20r%3D%221.2%22%2F%3E%20%3C%2Fg%3E%20%3Cg%20opacity%3D%220.45%22%20fill%3D%22%23FFFFFF%22%3E%20%3Cpath%20d%3D%22M0%20612h400v14H0z%22%2F%3E%3Cpath%20d%3D%22M0%20640h400v9H0z%22%2F%3E%20%3C%2Fg%3E%20%3Cpath%20d%3D%22M0%20452c62-34%20104%208%20160-14s104-42%20158-18%2058%2030%2082%2022v358H0z%22%20fill%3D%22url(%23far)%22%20opacity%3D%220.6%22%2F%3E%20%3Cpath%20d%3D%22M0%20528c70-30%20116%2016%20174-6s112-34%20158-8%2046%2026%2068%2018v268H0z%22%20fill%3D%22url(%23mid)%22%20opacity%3D%220.58%22%2F%3E%20%3Cpath%20d%3D%22M0%20604h400v196H0z%22%20fill%3D%22url(%23water)%22%20opacity%3D%220.5%22%2F%3E%20%3Cpath%20d%3D%22M0%20596c78-24%20126%2018%20190-4s118-24%20160%204%2034%2016%2050%2012v192H0z%22%20fill%3D%22url(%23near)%22%20opacity%3D%220.62%22%2F%3E%20%3Cg%20opacity%3D%220.62%22%20fill%3D%22%235E7BA8%22%3E%20%3Cpath%20d%3D%22M170%20660c0-11%204-18%209-18s9%207%209%2018v16h-18z%22%2F%3E%3Ccircle%20cx%3D%22179%22%20cy%3D%22636%22%20r%3D%227.5%22%2F%3E%20%3Cpath%20d%3D%22M194%20662c0-10%204-16%208-16s8%206%208%2016v14h-16z%22%2F%3E%3Ccircle%20cx%3D%22202%22%20cy%3D%22640%22%20r%3D%227%22%2F%3E%20%3Ccircle%20cx%3D%22187%22%20cy%3D%22655%22%20r%3D%229%22%2F%3E%20%3C%2Fg%3E%20%3Cellipse%20cx%3D%22190%22%20cy%3D%22680%22%20rx%3D%2240%22%20ry%3D%224%22%20fill%3D%22%235E7BA8%22%20opacity%3D%220.2%22%2F%3E%20%3C%2Fsvg%3E") center center / cover no-repeat;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(250,250,250,.30) 0%,rgba(250,250,250,.44) 44%,rgba(250,250,250,.66) 100%);
  }

  .art{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 12px;
       border-radius:16px;border:1px solid var(--line)}
  .couple{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.16em;
          text-transform:uppercase;color:var(--slate);margin:0 0 14px;
          background:rgba(255,255,255,.72);border:1px solid var(--line);
          border-radius:999px;padding:7px 16px;backdrop-filter:blur(6px)}

  .fade{animation:fd .22s ease}
  @keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .err{background:var(--pink-soft);color:var(--pink);border-radius:12px;padding:12px 14px;
       font-size:14px;font-weight:500}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--slate);
         color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;
         box-shadow:var(--shadow);z-index:50;max-width:90vw}

  /* ---- host extras ---- */
  .hrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .hrow:first-child{border-top:0}
  .hrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .seg button{border:0;background:#fff;padding:7px 11px;font-size:13px;font-weight:600;color:var(--sub)}
  .seg button.on.b{background:var(--blue);color:#fff}
  .seg button.on.p{background:var(--pink);color:#fff}
  .steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
  .steps button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;
                padding:8px 14px;font-size:13px;font-weight:600;color:var(--sub)}
  .steps button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
  code{background:#ECEFF1;padding:2px 6px;border-radius:6px;font-size:13px}
</style>
